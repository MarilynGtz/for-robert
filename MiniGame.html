<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>King Robert's Retro Adventure 👑</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0308;
            color: #fce7f3;
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        .retro-border {
            border: 4px solid #facc15;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.4), inset 0 0 12px rgba(0,0,0,0.9);
        }
        canvas {
            image-rendering: pixelated;
            background: #120510;
        }
        .btn-touch {
            touch-action: none;
        }
        .btn-touch:active {
            transform: scale(0.92);
            filter: brightness(1.25);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-2 select-none">

    <!-- TOP HEADER / HUD -->
    <header class="w-full max-w-md text-center py-1.5 z-10">
        <div class="inline-flex items-center gap-2 px-3 py-0.5 rounded-full bg-rose-950/80 border border-amber-400/50 text-amber-300 text-[10px] font-bold uppercase tracking-wider shadow-lg">
            <span>👑 King Robert's Quest</span>
        </div>
        <div class="flex justify-between items-center px-2 mt-1">
            <div class="text-left">
                <span class="text-[9px] text-rose-300 block">HEALTH</span>
                <div class="flex gap-1 text-sm" id="healthHearts">❤️❤️❤️</div>
            </div>
            <div class="text-center">
                <span class="text-[9px] text-amber-400 pixel-font block" id="levelName">STAGE 1: CLINIC ESCAPE</span>
                <span class="text-[9px] text-rose-200/80" id="objectiveText">Find the exit door 🚪!</span>
            </div>
            <div class="text-right">
                <span class="text-[9px] text-rose-300 block">LEVEL</span>
                <span class="text-xs font-bold text-amber-300 pixel-font" id="stageProgress">1/5</span>
            </div>
        </div>
    </header>

    <!-- GAME CANVAS CONTAINER -->
    <div class="relative w-full max-w-md flex-1 flex items-center justify-center my-1">
        <div class="relative w-full aspect-square max-h-[360px] retro-border rounded-xl overflow-hidden bg-rose-950">
            <canvas id="gameCanvas" width="320" height="320" class="w-full h-full block"></canvas>
            
            <!-- OVERLAY MESSAGE DIALOG -->
            <div id="dialogOverlay" class="absolute inset-x-2 bottom-2 bg-slate-950/95 border-2 border-amber-400 rounded-lg p-3 text-center text-xs space-y-2 hidden z-20">
                <p id="dialogText" class="text-rose-100 font-semibold leading-snug">Notice text...</p>
                <button id="dialogBtn" onclick="closeDialog()" class="px-4 py-1 bg-amber-400 text-slate-950 font-extrabold rounded-md text-xs uppercase shadow-md active:scale-95">Continue</button>
            </div>

            <!-- VICTORY & SURVEY OVERLAY SCREEN -->
            <div id="victoryOverlay" class="absolute inset-0 bg-rose-950/95 flex flex-col items-center justify-center p-3 text-center space-y-2 hidden z-30 overflow-y-auto">
                <div class="text-4xl animate-bounce" id="victoryEmoji">🏆👑</div>
                <h2 class="pixel-font text-amber-300 text-xs leading-snug" id="victoryTitle">QUEST COMPLETE!</h2>
                <p class="text-[11px] text-rose-100 max-w-xs leading-tight" id="victoryDesc">You beat all 5 levels!</p>

                <!-- SURVEY SECTION -->
                <div id="surveyBox" class="p-2 bg-slate-900/90 border border-amber-400/60 rounded-xl w-full text-center space-y-2">
                    <p class="text-[11px] font-bold text-amber-300">How do you like this game, King?</p>
                    <div class="grid grid-cols-2 gap-1.5" id="surveyButtons">
                        <button onclick="submitFeedback('Cheesy 🧀')" class="px-2 py-1.5 bg-rose-900 hover:bg-rose-800 text-rose-100 border border-amber-400/40 rounded-lg text-[10px] font-bold active:scale-95">🧀 Cheesy</button>
                        <button onclick="submitFeedback('Cute 💕')" class="px-2 py-1.5 bg-rose-900 hover:bg-rose-800 text-rose-100 border border-amber-400/40 rounded-lg text-[10px] font-bold active:scale-95">💕 Cute</button>
                        <button onclick="submitFeedback('Funny 😂')" class="px-2 py-1.5 bg-rose-900 hover:bg-rose-800 text-rose-100 border border-amber-400/40 rounded-lg text-[10px] font-bold active:scale-95">😂 Funny</button>
                        <button onclick="submitFeedback('Dumb 🤪')" class="px-2 py-1.5 bg-rose-900 hover:bg-rose-800 text-rose-100 border border-amber-400/40 rounded-lg text-[10px] font-bold active:scale-95">🤪 Dumb</button>
                    </div>
                    <p id="surveyThanks" class="text-[10px] text-emerald-300 font-bold hidden">Response saved to Marilyn's Dashboard! ❤️</p>
                </div>

                <button onclick="restartGame()" class="px-5 py-1.5 bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-bold rounded-lg text-xs uppercase shadow-lg active:scale-95">Play Again</button>
            </div>
        </div>
    </div>

    <!-- TOUCH CONTROLS FOR PHONE -->
    <div class="w-full max-w-md px-4 pb-2 pt-1 z-10">
        <div class="flex items-center justify-between gap-2">
            <!-- D-PAD CONTROLLER -->
            <div class="grid grid-cols-3 gap-1.5 w-36 h-36">
                <div></div>
                <button class="btn-touch bg-rose-900/90 border-2 border-amber-400/60 active:bg-amber-400 active:text-black text-white font-bold rounded-lg text-lg flex items-center justify-center shadow-md" ontouchstart="handleTouchStart('up')" ontouchend="handleTouchEnd('up')" onclick="movePlayer('up')">⬆️</button>
                <div></div>
                <button class="btn-touch bg-rose-900/90 border-2 border-amber-400/60 active:bg-amber-400 active:text-black text-white font-bold rounded-lg text-lg flex items-center justify-center shadow-md" ontouchstart="handleTouchStart('left')" ontouchend="handleTouchEnd('left')" onclick="movePlayer('left')">⬅️</button>
                <div class="bg-rose-950/50 rounded-lg flex items-center justify-center text-[9px] text-amber-400 font-bold">MOVE</div>
                <button class="btn-touch bg-rose-900/90 border-2 border-amber-400/60 active:bg-amber-400 active:text-black text-white font-bold rounded-lg text-lg flex items-center justify-center shadow-md" ontouchstart="handleTouchStart('right')" ontouchend="handleTouchEnd('right')" onclick="movePlayer('right')">➡️</button>
                <div></div>
                <button class="btn-touch bg-rose-900/90 border-2 border-amber-400/60 active:bg-amber-400 active:text-black text-white font-bold rounded-lg text-lg flex items-center justify-center shadow-md" ontouchstart="handleTouchStart('down')" ontouchend="handleTouchEnd('down')" onclick="movePlayer('down')">⬇️</button>
                <div></div>
            </div>

            <!-- ACTION / INTERACT BUTTON -->
            <div class="flex flex-col items-center justify-center">
                <button id="actionBtn" onclick="interactAction()" class="btn-touch w-28 h-28 bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 text-slate-950 font-extrabold rounded-full border-4 border-amber-200 shadow-xl flex flex-col items-center justify-center text-center p-2 active:scale-95">
                    <span class="text-2xl">🖐️</span>
                    <span class="text-[10px] font-black uppercase tracking-tighter leading-tight mt-1" id="actionBtnLabel">INTERACT</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE SETUP
        const firebaseConfig = {
            projectId: "for-robert",
            authDomain: "for-robert.firebaseapp.com",
            storageBucket: "for-robert.appspot.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let level = 1;
        let hp = 3;
        let touchInterval = null;
        let selectedOutcome = "";

        // RETRO PLAYER POSITION (Continuous pixel-based motion)
        let player = { x: 30, y: 30, speed: 10, size: 24 };

        // Sound Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSfx(freq, type='sine', duration=0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // 5 TOP-DOWN RETRO ROOM MAPS
        const levels = {
            1: {
                name: "STAGE 1: CLINIC ESCAPE",
                objective: "Avoid the IV stands 💉 & reach Exit 🚪!",
                bg: "#1a0814",
                exit: { x: 270, y: 260, w: 32, h: 32 },
                walls: [
                    { x: 80, y: 0, w: 20, h: 200 },
                    { x: 180, y: 100, w: 20, h: 220 }
                ],
                hazards: [
                    { x: 120, y: 60, icon: '💉' },
                    { x: 120, y: 140, icon: '💉' },
                    { x: 220, y: 180, icon: '🏥' }
                ],
                interacts: []
            },
            2: {
                name: "STAGE 2: COLD CORRIDOR",
                objective: "Slippery Hallway! Watch out for draft ❄️!",
                bg: "#081521",
                exit: { x: 270, y: 40, w: 32, h: 32 },
                walls: [
                    { x: 0, y: 100, w: 220, h: 20 },
                    { x: 100, y: 200, w: 220, h: 20 }
                ],
                hazards: [
                    { x: 50, y: 150, icon: '❄️' },
                    { x: 180, y: 250, icon: '❄️' }
                ],
                interacts: []
            },
            3: {
                name: "STAGE 3: WORK MOUNTAIN",
                objective: "Navigate past heavy office stacks 📚!",
                bg: "#1c1208",
                exit: { x: 270, y: 270, w: 32, h: 32 },
                walls: [
                    { x: 60, y: 60, w: 200, h: 20 },
                    { x: 60, y: 160, w: 200, h: 20 }
                ],
                hazards: [
                    { x: 100, y: 110, icon: '📚' },
                    { x: 200, y: 210, icon: '💼' }
                ],
                interacts: []
            },
            4: {
                name: "STAGE 4: MERCED COMMUTE",
                objective: "Cross the street past traffic 🚗!",
                bg: "#0d180f",
                exit: { x: 270, y: 30, w: 32, h: 32 },
                walls: [
                    { x: 0, y: 80, w: 140, h: 20 },
                    { x: 180, y: 180, w: 140, h: 20 }
                ],
                hazards: [
                    { x: 150, y: 40, icon: '🚗' },
                    { x: 80, y: 220, icon: '🏎️' }
                ],
                interacts: []
            },
            5: {
                name: "STAGE 5: MARILYN'S PLACE",
                objective: "Walk to Eat Out 🍕 OR Marilyn's Cooking 🥣!",
                bg: "#2b0a1a",
                exit: null,
                walls: [
                    { x: 150, y: 0, w: 20, h: 180 }
                ],
                hazards: [],
                interacts: [
                    { id: 'eatout', x: 50, y: 220, w: 50, h: 50, icon: '🍕', label: 'EAT OUT 🍕' },
                    { id: 'marilyn', x: 220, y: 220, w: 50, h: 50, icon: '👩🏽‍🦱🥣', label: 'MARILYN 🥣' }
                ]
            }
        };

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const lvl = levels[level];

            // Background
            ctx.fillStyle = lvl.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Exit Door
            if (lvl.exit) {
                ctx.fillStyle = '#facc15';
                ctx.fillRect(lvl.exit.x, lvl.exit.y, lvl.exit.w, lvl.exit.h);
                ctx.font = '20px sans-serif';
                ctx.fillText('🚪', lvl.exit.x + 4, lvl.exit.y + 24);
            }

            // Draw Solid Obstacle Walls
            lvl.walls.forEach(w => {
                ctx.fillStyle = '#4c1d24';
                ctx.fillRect(w.x, w.y, w.w, w.h);
                ctx.strokeStyle = '#9f1239';
                ctx.strokeRect(w.x+2, w.y+2, w.w-4, w.h-4);
            });

            // Draw Hazards
            lvl.hazards.forEach(h => {
                ctx.font = '22px sans-serif';
                ctx.fillText(h.icon, h.x, h.y);
            });

            // Draw Level 5 Interactive Choices
            if (lvl.interacts) {
                lvl.interacts.forEach(i => {
                    ctx.fillStyle = i.id === 'marilyn' ? '#be185d' : '#c2410c';
                    ctx.fillRect(i.x, i.y, i.w, i.h);
                    ctx.strokeStyle = '#facc15';
                    ctx.strokeRect(i.x, i.y, i.w, i.h);
                    ctx.font = '22px sans-serif';
                    ctx.fillText(i.icon, i.x + 8, i.y + 34);
                });
            }

            // Draw Player King Crown
            ctx.font = '26px sans-serif';
            ctx.shadowColor = '#facc15';
            ctx.shadowBlur = 12;
            ctx.fillText('👑', player.x, player.y + 20);
            ctx.shadowBlur = 0;

            updateActionButton();
        }

        function movePlayer(dir) {
            let dx = 0, dy = 0;
            if (dir === 'up') dy = -player.speed;
            if (dir === 'down') dy = player.speed;
            if (dir === 'left') dx = -player.speed;
            if (dir === 'right') dx = player.speed;

            let nextX = Math.max(10, Math.min(280, player.x + dx));
            let nextY = Math.max(10, Math.min(280, player.y + dy));

            // Collision with Walls
            const lvl = levels[level];
            let hitWall = false;
            lvl.walls.forEach(w => {
                if (nextX + 10 > w.x && nextX < w.x + w.w && nextY + 10 > w.y && nextY < w.y + w.h) {
                    hitWall = true;
                }
            });

            if (hitWall) {
                playSfx(140, 'square', 0.08);
                return;
            }

            player.x = nextX;
            player.y = nextY;
            playSfx(280, 'sine', 0.04);

            // Check Hazard Collisions
            lvl.hazards.forEach(h => {
                if (Math.abs(player.x - h.x) < 22 && Math.abs(player.y - h.y) < 22) {
                    hp--;
                    playSfx(100, 'sawtooth', 0.2);
                    updateHearts();
                    showDialog("Ouch! You bumped an obstacle! Fall back!");
                    player.x = 20;
                    player.y = 20;
                    if (hp <= 0) {
                        showDialog("You got tired! Marilyn gives you a hug to heal you back up ❤️");
                        hp = 3;
                        updateHearts();
                    }
                }
            });

            // Check Exit Door Collision
            if (lvl.exit && player.x + 10 > lvl.exit.x && player.x < lvl.exit.x + lvl.exit.w && player.y + 10 > lvl.exit.y && player.y < lvl.exit.y + lvl.exit.h) {
                level++;
                player.x = 20;
                player.y = 20;
                document.getElementById('levelName').innerText = levels[level].name;
                document.getElementById('objectiveText').innerText = levels[level].objective;
                document.getElementById('stageProgress').innerText = level + "/5";
                showDialog(`Stage Cleared! Welcome to ${levels[level].name}! ✨`);
            }

            drawGame();
        }

        function updateActionButton() {
            const label = document.getElementById('actionBtnLabel');
            if (level === 5) {
                if (player.x < 120) label.innerText = "EAT OUT 🍕";
                else if (player.x > 180) label.innerText = "MARILYN 🥣";
                else label.innerText = "INTERACT";
            } else {
                label.innerText = "INTERACT";
            }
        }

        function interactAction() {
            if (level === 5) {
                if (player.x < 140) {
                    selectedOutcome = "Eat Out 🍕";
                    finishGame("🍕 Pizza & Takeout Date!", "King Robert chose to Eat Out! A delicious treat date locked in!");
                } else {
                    selectedOutcome = "Marilyn's Cooking 🥣";
                    finishGame("🥣 Marilyn's Homemade Cooking!", "King Robert chose Marilyn's Cooking! Homemade soup & pampering coming right up!");
                }
                return;
            }
            showDialog("King Robert is exploring... Move toward the exit 🚪!");
        }

        function finishGame(title, desc) {
            playSfx(587, 'sine', 0.3);
            playSfx(880, 'sine', 0.4);
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

            document.getElementById('victoryTitle').innerText = title;
            document.getElementById('victoryDesc').innerText = desc;
            document.getElementById('victoryOverlay').classList.remove('hidden');

            // Save choice outcome to Firestore
            try {
                db.collection("checkins").add({
                    feeling: `Game Outcome: ${selectedOutcome}`,
                    type: "game_choice",
                    date: new Date().toLocaleString(),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch(e){}
        }

        function submitFeedback(rating) {
            playSfx(523, 'sine', 0.2);
            document.getElementById('surveyButtons').classList.add('hidden');
            document.getElementById('surveyThanks').classList.remove('hidden');

            // Save rating survey to Firestore
            try {
                db.collection("checkins").add({
                    feeling: `Game Rating: ${rating}`,
                    note: `Outcome chosen was: ${selectedOutcome}`,
                    type: "game_feedback",
                    date: new Date().toLocaleString(),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch(e){}
        }

        function updateHearts() {
            let heartsStr = "";
            for (let i = 0; i < hp; i++) heartsStr += "❤️";
            document.getElementById('healthHearts').innerText = heartsStr || "💔";
        }

        function showDialog(text) {
            document.getElementById('dialogText').innerText = text;
            document.getElementById('dialogOverlay').classList.remove('hidden');
        }

        function closeDialog() {
            document.getElementById('dialogOverlay').classList.add('hidden');
        }

        function restartGame() {
            level = 1;
            hp = 3;
            player = { x: 30, y: 30, speed: 10, size: 24 };
            document.getElementById('levelName').innerText = levels[1].name;
            document.getElementById('objectiveText').innerText = levels[1].objective;
            document.getElementById('stageProgress').innerText = "1/5";
            document.getElementById('victoryOverlay').classList.add('hidden');
            document.getElementById('surveyButtons').classList.remove('hidden');
            document.getElementById('surveyThanks').classList.add('hidden');
            updateHearts();
            drawGame();
        }

        function handleTouchStart(dir) {
            movePlayer(dir);
            touchInterval = setInterval(() => movePlayer(dir), 120);
        }
        function handleTouchEnd() {
            if (touchInterval) clearInterval(touchInterval);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') movePlayer('up');
            if (e.key === 'ArrowDown' || e.key === 's') movePlayer('down');
            if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer('left');
            if (e.key === 'ArrowRight' || e.key === 'd') movePlayer('right');
            if (e.key === ' ' || e.key === 'Enter') interactAction();
        });

        drawGame();
    </script>
</body>
</html>
